name: Custom iOS build prerequisites

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-configuration:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate private application configuration
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          import json

          required = ("TELEGRAM_API_ID", "TELEGRAM_API_HASH", "IOS_BUNDLE_ID", "APPLE_TEAM_ID")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              print("Missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)

          api_id = os.environ["TELEGRAM_API_ID"]
          api_hash = os.environ["TELEGRAM_API_HASH"]
          bundle_id = os.environ["IOS_BUNDLE_ID"]
          team_id = os.environ["APPLE_TEAM_ID"]
          if not api_id.isdigit() or not re.fullmatch(r"[0-9a-fA-F]{32}", api_hash):
              sys.exit("Invalid Telegram API ID/hash format")
          if not re.fullmatch(r"[A-Za-z0-9-]+(?:\\.[A-Za-z0-9-]+)+", bundle_id):
              sys.exit("Invalid iOS bundle identifier")
          if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
              sys.exit("Invalid Apple Team ID")
          if bundle_id == "ph.telegra.Telegraph":
              sys.exit("Use a unique bundle identifier, not Telegram's official one")

          template = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          template.update({
              "bundle_id": bundle_id,
              "api_id": api_id,
              "api_hash": api_hash,
              "team_id": team_id,
              "app_specific_url_scheme": "tg",
              "enable_siri": True,
              "enable_icloud": False,
          })
          output = Path("build-system/custom-development-configuration.json")
          output.write_text(json.dumps(template, indent=2) + "\n")
          print("Custom development configuration generated successfully (not uploaded).")
          print("Next prerequisite: compatible macOS/Xcode runner and valid device signing.")
          PY
